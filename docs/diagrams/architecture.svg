<text class="name" x="312" y="208">Webhook</text>
<text class="sub" x="312" y="232">webhook.py</text>
<text class="sub" x="312" y="254">verify, size, 202</text>
<rect class="svc" x="608" y="176" width="216" height="92" rx="12"/>
<text class="name" x="624" y="208">Signature check</text>
<text class="sub" x="624" y="232">signature.py</text>
<text class="sub" x="624" y="254">HMAC, 5-minute age</text>
<rect class="svc" x="952" y="176" width="200" height="116" rx="12"/>
<text class="name" x="968" y="208">ChatModel</text>
<text class="sub" x="968" y="232">fake_model.py</text>
<text class="sub" x="968" y="254">cassette.py</text>
<text class="sub" x="968" y="276">claude_model.py</text>
<rect class="note" x="48" y="340" width="240" height="116" rx="10"/>
<text class="label b t-warn" x="64" y="370">make crash-test</text>
