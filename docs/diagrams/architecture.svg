<text class="sub" x="64" y="440">lost [], duplicated 0</text>
<rect class="svc" x="360" y="340" width="208" height="92" rx="12"/>
<text class="name" x="376" y="372">Worker</text>
<text class="sub" x="376" y="396">worker.py</text>
<text class="sub" x="376" y="418">bounded thread pool</text>
<rect class="svc" x="656" y="340" width="232" height="116" rx="12"/>
<text class="name" x="672" y="372">Handler</text>
<text class="sub" x="672" y="396">handler.py</text>
<text class="sub" x="672" y="418">dedupe, deadline</text>
<text class="sub" x="672" y="440">ack, retry, dead-letter</text>
