<text class="name" x="992" y="372">Extractor</text>
<text class="sub" x="992" y="396">extraction.py</text>
<text class="sub" x="992" y="418">one repair call</text>
<rect class="boundary" x="264" y="492" width="888" height="214" rx="14"/>
<text class="tag" x="280" y="520">PostgreSQL 16</text>
<path class="store" d="M288 542a112 12 0 0 1 224 0v102a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M288 542a112 12 0 0 0 224 0"/>
<text class="name" x="400" y="570" text-anchor="middle">deliveries</text>
<text class="sub" x="400" y="592" text-anchor="middle">queued, processing</text>
