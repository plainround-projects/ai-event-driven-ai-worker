<path class="store" d="M560 542a128 12 0 0 1 256 0v128a128 12 0 0 1 -256 0z"/>
<path class="rim" d="M560 542a128 12 0 0 0 256 0"/>
<text class="name" x="688" y="570" text-anchor="middle">effects</text>
<text class="sub" x="688" y="592" text-anchor="middle">processed_events</text>
<text class="sub" x="688" y="614" text-anchor="middle">tickets</text>
<text class="sub" x="688" y="636" text-anchor="middle">outbox</text>
<path class="store" d="M872 542a116 12 0 0 1 232 0v102a116 12 0 0 1 -232 0z"/>
<path class="rim" d="M872 542a116 12 0 0 0 232 0"/>
<text class="name" x="988" y="570" text-anchor="middle">dead_letters</text>
<text class="sub" x="988" y="592" text-anchor="middle">reason, attempts</text>
<text class="sub" x="988" y="614" text-anchor="middle">payload hash</text>
